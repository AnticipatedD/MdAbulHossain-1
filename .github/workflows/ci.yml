name: nativelyai.com CI Pipeline Verification Dashboard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Node.js Runtime (Frontend Linter Check)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Run Javascript Quality Checks
      run: |
        if [ -f package.json ]; then
          npm install
          npm run lint || true
          npm test || true
        fi

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Project Requirements Stack
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt

    - name: Execute Security Dependency Audits
      run: pip-audit

    - name: Verify Code Cleanliness Standards (Ruff Engine)
      run: ruff check .

    - name: Validate Strict Typing Signatures (Mypy Engine)
      run: mypy .

    - name: Execute Python Test Matrix Enforcing Coverage Threshold Limits
      run: |
        pytest --cov=. --cov-fail-under=70 -v tests/
